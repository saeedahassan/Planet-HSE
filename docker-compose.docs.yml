services:
  docs:
    image: planet_hse_local_docs
    container_name: planet_hse_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./planet_hse:/app/planet_hse:z
    ports:
      - '9000:9000'
    command: /start-docs
